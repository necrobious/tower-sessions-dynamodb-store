[package]
name = "tower-sessions-dynamodb-store"
version = "0.4.0"
edition = "2021"
description = "AWS DynamoDB session store. Not for direct use; see the `tower-sessions` crate for details."
authors = ["Kirk Peterson <necrobious@gmail.com>"]
license = "MIT"
keywords = ["session", "sessions", "cookie", "tower", "dynamodb"]
categories = ["asynchronous", "network-programming", "web-programming"]
repository = "https://github.com/necrobious/tower-sessions-dynamodb-store"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = { version = "0.1" }
aws-config = { version = "1.13" }
aws-sdk-dynamodb = { version = "1.137", default-features = false, features = ["default-https-client", "rt-tokio"] }
rmp-serde = { version = "1.3" }
serde = { version = "1.0", features = ["derive", "rc"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde"] }
tower-sessions = { version = "0.15" }
tracing = { version = "0.1.44" }

[dev-dependencies]
axum =  { version = "0.8" }
tokio = { version = "1.54", features = ["full"] }
tower-sessions-core = { version = "0.15", features = ["deletion-task"] }
tower = { version = "0.5", features = ["timeout"] }
tokio-test = { version = "0.4" }
tower-cookies = { version = "0.11.0" }

[[example]]
name = "counter"

